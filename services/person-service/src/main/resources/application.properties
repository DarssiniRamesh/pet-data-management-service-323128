spring.application.name=person-service

# H2 Database Configuration
# NOTE: DB schema is managed by Flyway migrations under classpath:db/migration
spring.datasource.url=jdbc:h2:mem:persondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Flyway (DB migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# IMPORTANT: disable Hibernate DDL generation; Flyway is the single source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# Use a dedicated port in local dev if desired (optional; defaults to 8080)
# server.port=3002
