spring.application.name=api-gateway

# Local dev port for the gateway (client-facing)
server.port=3000

# Respect X-Forwarded-* / Forwarded headers (important when deployed behind proxies)
server.forward-headers-strategy=framework

# Downstream targets (override via env vars if needed)
gateway.targets.person-service=${GATEWAY_TARGETS_PERSON_SERVICE:http://localhost:3002}
gateway.targets.monolith=${GATEWAY_TARGETS_MONOLITH:http://localhost:3001}

# Basic Auth credentials (override via env vars; dev defaults are OK for local)
gateway.security.basic.username=${GATEWAY_SECURITY_BASIC_USERNAME:admin}
gateway.security.basic.password=${GATEWAY_SECURITY_BASIC_PASSWORD:admin}

# ------------------------------------------------------------------------------
# Strangler routing:
# - /application/person/** -> person-service (new)
# - everything else -> monolith (existing)
# ------------------------------------------------------------------------------
spring.cloud.gateway.routes[0].id=person-service
spring.cloud.gateway.routes[0].uri=${gateway.targets.person-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/application/person/**

spring.cloud.gateway.routes[1].id=monolith
spring.cloud.gateway.routes[1].uri=${gateway.targets.monolith}
spring.cloud.gateway.routes[1].predicates[0]=Path=/**

# ------------------------------------------------------------------------------
# OpenAPI aggregation (proxy downstream service specs through the gateway)
#
# We expose each downstream OpenAPI JSON under a distinct, stable gateway path:
# - /api-docs/person-service   -> person-service /api-docs
# - /api-docs/monolith         -> monolith /api-docs
#
# Then we configure Swagger UI to list them using springdoc.swagger-ui.urls[*].
# ------------------------------------------------------------------------------
spring.cloud.gateway.routes[2].id=openapi-person-service
spring.cloud.gateway.routes[2].uri=${gateway.targets.person-service}
# Match both:
# - /api-docs/person-service
# - /api-docs/person-service/** (e.g. /swagger-config)
spring.cloud.gateway.routes[2].predicates[0]=Path=/api-docs/person-service, /api-docs/person-service/**
# Rewrite to downstream springdoc paths:
# - /api-docs/person-service            -> /api-docs
# - /api-docs/person-service/swagger-config -> /api-docs/swagger-config
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api-docs/person-service(?<segment>/?.*), /api-docs${segment}

spring.cloud.gateway.routes[3].id=openapi-monolith
spring.cloud.gateway.routes[3].uri=${gateway.targets.monolith}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api-docs/monolith, /api-docs/monolith/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api-docs/monolith(?<segment>/?.*), /api-docs${segment}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# ------------------------------------------------------------------------------
# OpenAPI docs for the gateway itself (served by springdoc, NOT proxied)
#
# IMPORTANT:
# - We reserve /api-docs/** for proxied downstream service specs (Gateway routes).
# - springdoc (WebFlux) registers a handler for its api-docs path and can shadow
#   gateway routes if it shares the /api-docs prefix.
# - Therefore the gateway's own OpenAPI JSON is moved to /gateway-api-docs.
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/gateway-api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Swagger UI aggregation list (dropdown)
# NOTE: "url" values are gateway-local paths. These work both locally and behind a proxy.
springdoc.swagger-ui.urls[0].name=api-gateway
springdoc.swagger-ui.urls[0].url=/gateway-api-docs

springdoc.swagger-ui.urls[1].name=person-service
springdoc.swagger-ui.urls[1].url=/api-docs/person-service

springdoc.swagger-ui.urls[2].name=pets-backend (monolith)
springdoc.swagger-ui.urls[2].url=/api-docs/monolith
