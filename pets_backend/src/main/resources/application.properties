spring.application.name=petsbackend

# Server Configuration
# Bind to the platform-provided port (PORT=3002 in this environment) instead of defaulting to 8080.
server.port=${PORT:3002}
# Ensure the service is reachable from outside the container.
server.address=0.0.0.0

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Actuator Configuration
# Keep actuator on the same port as the main server (avoid any extra port binding surprises).
management.endpoints.web.exposure.include=health,info,metrics
management.server.port=${server.port}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework
