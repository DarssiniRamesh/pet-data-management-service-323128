spring.application.name=petsbackend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration (pets_backend / monolith itself)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --------------------------------------------------------------------------------
# Multi-spec Swagger UI aggregation (dropdown)
#
# springdoc supports a multi-spec dropdown via `springdoc.swagger-ui.urls[*]`.
# Each entry must be reachable by the user's browser from the pets_backend preview.
#
# IMPORTANT about reachability from :3001 preview:
# - pets_backend spec is served locally at /api-docs (works in all environments).
# - person-service and api-gateway are separate services; in local dev they
#   typically run on different ports (e.g., 3002 / 3000). In the Kavia preview,
#   those ports are not reachable via the same public host by default.
#
# Therefore we configure:
# - A local entry for pets_backend
# - Optional external URLs that can be enabled by setting environment variables.
#   If not set, the entries remain present but may not load; set them when the
#   other services are reachable (e.g., via gateway/proxy exposing them).
#
# Env vars to set when available:
# - PERSON_SERVICE_OPENAPI_URL   (e.g., https://<host>:3002/api-docs OR a gateway path)
# - API_GATEWAY_OPENAPI_URL      (e.g., https://<host>:3000/gateway-api-docs OR similar)
# --------------------------------------------------------------------------------

# pets_backend (always reachable)
springdoc.swagger-ui.urls[0].name=pets-backend (this service)
springdoc.swagger-ui.urls[0].url=/api-docs

# IMPORTANT:
# Do NOT configure other services here with empty default values.
# When springdoc sees an empty `url`, it may emit "/" in /api-docs/swagger-config.
# Swagger UI then loads "/" (HTML), which triggers:
# "Unable to render this definition... missing a valid version field."
#
# Instead, enable aggregation explicitly via the "aggregate" profile below.

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# --------------------------------------------------------------------------------
# Optional: Multi-spec Swagger UI aggregation profile
#
# Enable with:
#   --spring.profiles.active=aggregate
#
# And set environment variables to BROWSER-REACHABLE OpenAPI JSON URLs:
# - PERSON_SERVICE_OPENAPI_URL  (example: https://<host>/api-docs/person-service via gateway/proxy)
# - API_GATEWAY_OPENAPI_URL     (example: https://<host>/gateway-api-docs via gateway/proxy)
#
# NOTE: In the Kavia preview for pets_backend (:3001), other service ports are
# typically not reachable on the same public host unless you expose them via a
# gateway/proxy. Prefer gateway-local paths when available.
# --------------------------------------------------------------------------------

spring.config.activate.on-profile=aggregate

springdoc.swagger-ui.urls[1].name=person-service
springdoc.swagger-ui.urls[1].url=${PERSON_SERVICE_OPENAPI_URL}

springdoc.swagger-ui.urls[2].name=api-gateway
springdoc.swagger-ui.urls[2].url=${API_GATEWAY_OPENAPI_URL}
